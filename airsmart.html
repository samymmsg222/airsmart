<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  height:100%;
  font-family:'DM Sans',sans-serif;
  background:#072f47;
  overflow-x:hidden;
}

body{
  padding:20px 16px 32px;
  position:relative;
}

.content{
  position:relative;
  z-index:1;
}

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:28px;
}

.greeting{
  font-size:13px;
  color:rgba(255,255,255,0.7);
  letter-spacing:0.3px;
  font-weight:500;
}

.status-pill{
  display:flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.12);
  border-radius:20px;
  padding:5px 12px 5px 8px;
  border:1px solid rgba(255,255,255,0.2);
}

.status-pill.offline .dot{
  background:#f43f5e;
}

.status-pill.online .dot{
  background:#10b981;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.status-pill span{
  font-size:12px;
  color:white;
  font-weight:500;
}

.big-num-card{
  border-radius:22px;
  padding:22px 22px 18px;
  margin-bottom:12px;
  position:relative;
  overflow:hidden;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.18);
}

.card-label{
  font-size:11px;
  font-weight:500;
  letter-spacing:1.2px;
  text-transform:uppercase;
  margin-bottom:12px;
  opacity:0.6;
  color:white;
}

.card-value{
  font-family:'DM Mono', monospace;
  font-size:58px;
  font-weight:400;
  line-height:1;
  color:white;
}

.card-unit{
  font-size:24px;
  opacity:0.6;
  margin-left:2px;
}

.bar-track{
  height:3px;
  background:rgba(255,255,255,0.12);
  border-radius:2px;
  margin-top:18px;
}

.bar-fill{
  height:100%;
  border-radius:2px;
  background:rgba(255,255,255,0.45);
}

.two-col{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.small-card{
  background:rgba(255,255,255,0.1);
  border-radius:16px;
  padding:16px;
  border:1px solid rgba(255,255,255,0.15);
}

.small-label{
  font-size:10px;
  color:rgba(255,255,255,0.55);
  letter-spacing:1px;
  text-transform:uppercase;
  margin-bottom:8px;
  font-weight:500;
}

.small-val{
  font-family:'DM Mono', monospace;
  font-size:28px;
  color:white;
  font-weight:400;
}

.small-unit{
  font-size:14px;
  opacity:0.55;
}

.fan-card{
  background:rgba(0,0,0,0.3);
  border-radius:18px;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid rgba(255,255,255,0.1);
}

.fan-title{
  font-size:15px;
  font-weight:500;
  color:white;
}

.fan-sub{
  font-size:12px;
  color:rgba(255,255,255,0.45);
  margin-top:3px;
}

.fan-badge{
  font-size:11px;
  font-weight:500;
  padding:5px 12px;
  border-radius:20px;
}

.active{
  background:#10b98122;
  color:#6ee7b7;
  border:1px solid #10b98144;
}

.inactive{
  background:rgba(255,255,255,0.08);
  color:rgba(255,255,255,0.35);
  border:1px solid rgba(255,255,255,0.12);
}
</style>
</head>

<body>

<div class="content">

<div class="top-row">
<div class="greeting">Control de humedad</div>

<div class="status-pill online">
<div class="dot"></div>
<span>En línea</span>
</div>
</div>

<div class="big-num-card">

<div class="card-label">HUMEDAD</div>

<div class="card-value">
{{HUM}}
<span class="card-unit">%</span>
</div>

<div class="bar-track">
<div class="bar-fill" style="width:{{HUM}}%"></div>
</div>

</div>

<div class="big-num-card">

<div class="card-label">TEMPERATURA</div>

<div class="card-value">
{{TEMP}}
<span class="card-unit">°C</span>
</div>

<div class="bar-track">
<div class="bar-fill" style="width:{{TEMP}}%"></div>
</div>

</div>

<div class="two-col">

<div class="small-card">
<div class="small-label">Uso activo</div>

<div class="small-val">
{{TIEMPO}}
<span class="small-unit">s</span>
</div>
</div>

<div class="small-card">
<div class="small-label">Ventilador</div>

<div class="small-val">
{{VENT}}
</div>
</div>

</div>

<div class="fan-card">

<div>
<div class="fan-title">Ventilador</div>
<div class="fan-sub">{{ESTADO}}</div>
</div>

<div class="fan-badge {{CLASE}}">
{{BADGE}}
</div>

</div>

</div>

</body>
</html>
